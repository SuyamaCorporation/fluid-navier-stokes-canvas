<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Eulerian Fluid Canvas</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4">
<div class="max-w-3xl mx-auto">
  <h1 class="text-xl font-bold text-center mb-2 text-blue-400">Interactive Fluid Simulation</h1>
  <p class="text-center text-gray-500 text-xs mb-4">Jos Stam's stable fluids algorithm — drag to add velocity</p>

  <div class="flex gap-3 mb-3 flex-wrap justify-center text-sm">
    <button onclick="setVis('density')" id="bDens" class="bg-blue-600 px-3 py-1 rounded text-xs">Density</button>
    <button onclick="setVis('velocity')" id="bVel" class="bg-gray-600 px-3 py-1 rounded text-xs">Velocity</button>
    <button onclick="clearFluid()" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-xs">Clear</button>
    <label class="flex items-center gap-1 text-xs text-gray-400">
      <input type="checkbox" id="addSource" checked class="accent-blue-500"> Auto source
    </label>
  </div>

  <canvas id="canvas" class="w-full rounded border border-gray-800 cursor-crosshair" aria-label="Interactive fluid simulation" style="touch-action:none"></canvas>

  <p class="text-center text-gray-600 text-xs mt-2">Drag mouse over canvas to create fluid flow</p>
</div>

<script>
const N = 64; // Grid size
const SIZE = (N+2)*(N+2);
let dt = 0.1, diff = 0.00001, visc = 0.000001;

let dens = new Float32Array(SIZE);
let densOld = new Float32Array(SIZE);
let vx = new Float32Array(SIZE), vy = new Float32Array(SIZE);
let vxOld = new Float32Array(SIZE), vyOld = new Float32Array(SIZE);

let vis = 'density';
let isDragging = false;
let lastX = 0, lastY = 0;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, cellW, cellH;

function idx(x, y) { return x + (N+2)*y; }
function SWAP(a, b) { const t = new Float32Array(a); a.set(b); b.set(t); }

function addSource(x, s, dt2) {
  for (let i = 0; i < SIZE; i++) x[i] += dt2 * s[i];
}

function setBound(b, x) {
  for (let i = 1; i <= N; i++) {
    x[idx(0,i)] = b===1 ? -x[idx(1,i)] : x[idx(1,i)];
    x[idx(N+1,i)] = b===1 ? -x[idx(N,i)] : x[idx(N,i)];
    x[idx(i,0)] = b===2 ? -x[idx(i,1)] : x[idx(i,1)];
    x[idx(i,N+1)] = b===2 ? -x[idx(i,N)] : x[idx(i,N)];
  }
  x[idx(0,0)] = 0.5*(x[idx(1,0)]+x[idx(0,1)]);
  x[idx(0,N+1)] = 0.5*(x[idx(1,N+1)]+x[idx(0,N)]);
  x[idx(N+1,0)] = 0.5*(x[idx(N,0)]+x[idx(N+1,1)]);
  x[idx(N+1,N+1)] = 0.5*(x[idx(N,N+1)]+x[idx(N+1,N)]);
}

function linSolve(b, x, x0, a, c) {
  for (let k = 0; k < 8; k++) {
    for (let j = 1; j <= N; j++) {
      for (let i = 1; i <= N; i++) {
        x[idx(i,j)] = (x0[idx(i,j)] + a*(x[idx(i-1,j)]+x[idx(i+1,j)]+x[idx(i,j-1)]+x[idx(i,j+1)])) / c;
      }
    }
    setBound(b, x);
  }
}

function diffuse(b, x, x0, diff2) {
  const a = dt * diff2 * N * N;
  linSolve(b, x, x0, a, 1 + 4*a);
}

function advect(b, d, d0, u, v) {
  const dt0 = dt * N;
  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      let x2 = i - dt0*u[idx(i,j)];
      let y2 = j - dt0*v[idx(i,j)];
      x2 = Math.max(0.5, Math.min(N+0.5, x2));
      y2 = Math.max(0.5, Math.min(N+0.5, y2));
      const i0=Math.floor(x2), i1=i0+1;
      const j0=Math.floor(y2), j1=j0+1;
      const s1=x2-i0, s0=1-s1;
      const t1=y2-j0, t0=1-t1;
      d[idx(i,j)] = s0*(t0*d0[idx(i0,j0)]+t1*d0[idx(i0,j1)])+s1*(t0*d0[idx(i1,j0)]+t1*d0[idx(i1,j1)]);
    }
  }
  setBound(b, d);
}

function project(u, v, p, div2) {
  const h = 1.0/N;
  for (let j=1;j<=N;j++) for (let i=1;i<=N;i++) {
    div2[idx(i,j)] = -0.5*h*(u[idx(i+1,j)]-u[idx(i-1,j)]+v[idx(i,j+1)]-v[idx(i,j-1)]);
    p[idx(i,j)] = 0;
  }
  setBound(0, div2); setBound(0, p);
  linSolve(0, p, div2, 1, 4);
  for (let j=1;j<=N;j++) for (let i=1;i<=N;i++) {
    u[idx(i,j)] -= 0.5*(p[idx(i+1,j)]-p[idx(i-1,j)])/h;
    v[idx(i,j)] -= 0.5*(p[idx(i,j+1)]-p[idx(i,j-1)])/h;
  }
  setBound(1,u); setBound(2,v);
}

function velStep() {
  addSource(vx, vxOld, dt);
  addSource(vy, vyOld, dt);
  SWAP(vxOld, vx); diffuse(1, vx, vxOld, visc);
  SWAP(vyOld, vy); diffuse(2, vy, vyOld, visc);
  const tmp1 = new Float32Array(SIZE), tmp2 = new Float32Array(SIZE);
  project(vx, vy, tmp1, tmp2);
  SWAP(vxOld, vx); SWAP(vyOld, vy);
  advect(1, vx, vxOld, vxOld, vyOld);
  advect(2, vy, vyOld, vxOld, vyOld);
  project(vx, vy, tmp1, tmp2);
}

function densStep() {
  addSource(dens, densOld, dt);
  SWAP(densOld, dens); diffuse(0, dens, densOld, diff);
  SWAP(densOld, dens); advect(0, dens, densOld, vx, vy);
}

function clearFluid() {
  dens.fill(0); densOld.fill(0);
  vx.fill(0); vy.fill(0); vxOld.fill(0); vyOld.fill(0);
}

function renderDensity() {
  const imgData = ctx.createImageData(W, H);
  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      const d = Math.min(1, dens[idx(i,j)]);
      const x0 = Math.round((i-1)*cellW), y0 = Math.round((j-1)*cellH);
      const x1 = Math.round(i*cellW), y1 = Math.round(j*cellH);
      for (let py = y0; py < y1 && py < H; py++) {
        for (let px = x0; px < x1 && px < W; px++) {
          const p = (py*W+px)*4;
          imgData.data[p] = Math.floor(d*100);
          imgData.data[p+1] = Math.floor(d*200);
          imgData.data[p+2] = Math.floor(d*255);
          imgData.data[p+3] = 255;
        }
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function renderVelocity() {
  ctx.fillStyle = '#000008';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(0,200,255,0.6)';
  ctx.lineWidth = 1;
  for (let j = 1; j <= N; j+=2) {
    for (let i = 1; i <= N; i+=2) {
      const x0 = (i-0.5)*cellW, y0 = (j-0.5)*cellH;
      const u = vx[idx(i,j)]*cellW*5, v = vy[idx(i,j)]*cellH*5;
      if (Math.abs(u)+Math.abs(v) > 0.3) {
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x0+u, y0+v);
        ctx.stroke();
      }
    }
  }
}

function addFluidAt(xi, yi, dvx, dvy) {
  const i = Math.max(1, Math.min(N, Math.round(xi*(N)/W)+1));
  const j = Math.max(1, Math.min(N, Math.round(yi*(N)/H)+1));
  densOld[idx(i,j)] += 50;
  vxOld[idx(i,j)] += dvx * 5;
  vyOld[idx(i,j)] += dvy * 5;
}

function loop() {
  // Fade sources
  for (let i=0;i<SIZE;i++) { densOld[i]*=0.99; vxOld[i]*=0.95; vyOld[i]*=0.95; }

  // Auto source
  if (document.getElementById('addSource').checked) {
    const t = Date.now()*0.001;
    addFluidAt(W/2 + Math.sin(t)*W*0.2, H*0.5, Math.sin(t)*3, -1);
  }

  velStep();
  densStep();

  if (vis === 'density') renderDensity();
  else renderVelocity();

  requestAnimationFrame(loop);
}

function setVis(v) {
  vis = v;
  document.getElementById('bDens').className = 'px-3 py-1 rounded text-xs ' + (v==='density' ? 'bg-blue-600' : 'bg-gray-600');
  document.getElementById('bVel').className = 'px-3 py-1 rounded text-xs ' + (v==='velocity' ? 'bg-blue-600' : 'bg-gray-600');
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  W = canvas.width = rect.width || 512;
  H = canvas.height = W * 0.6;
  cellW = W / N; cellH = H / N;
}

canvas.addEventListener('mousedown', e => { isDragging=true; const r=canvas.getBoundingClientRect(); lastX=e.clientX-r.left; lastY=e.clientY-r.top; });
canvas.addEventListener('mouseup', () => isDragging=false);
canvas.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  addFluidAt(mx, my, (mx-lastX)*0.5, (my-lastY)*0.5);
  lastX=mx; lastY=my;
});
canvas.addEventListener('touchstart', e => { e.preventDefault(); isDragging=true; const t=e.touches[0]; const r=canvas.getBoundingClientRect(); lastX=t.clientX-r.left; lastY=t.clientY-r.top; }, {passive:false});
canvas.addEventListener('touchend', () => isDragging=false);
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!isDragging) return;
  const t=e.touches[0]; const r=canvas.getBoundingClientRect();
  const mx=t.clientX-r.left, my=t.clientY-r.top;
  addFluidAt(mx, my, (mx-lastX)*0.5, (my-lastY)*0.5);
  lastX=mx; lastY=my;
}, {passive:false});

window.addEventListener('resize', () => { resize(); });
resize();
loop();
</script>
</body>
</html>
